services:
  utxo-node-1:
    build:
      context: .
      dockerfile: Dockerfile.vmd
    image: utxo-vmd:local
    container_name: utxo-node-1
    restart: unless-stopped
    command: >
      --chain JKC_TESTNET
      --rpc-port 9773
      --p2p-port 2232
      --data-dir /app/data
    ports:
      - "9773:9773"
      - "2232:2232"
    environment:
      - RUST_LOG=info,utxo_vmd=debug
      - CHAIN=JKC_TESTNET
      - ELECTRS_URL=http://electrs:3000
    volumes:
      - node1-data:/app/data
    networks:
      - utxo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9773/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  utxo-node-2:
    build:
      context: .
      dockerfile: Dockerfile.vmd
    image: utxo-vmd:local
    container_name: utxo-node-2
    restart: unless-stopped
    command: >
      --chain JKC_TESTNET
      --rpc-port 9773
      --p2p-port 2232
      --data-dir /app/data
      --bootstrap-peers /ip4/utxo-node-1/tcp/2232
    ports:
      - "9774:9773"
      - "2233:2232"
    environment:
      - RUST_LOG=info,utxo_vmd=debug
      - CHAIN=JKC_TESTNET
      - ELECTRS_URL=http://electrs:3000
    volumes:
      - node2-data:/app/data
    depends_on:
      utxo-node-1:
        condition: service_healthy
    networks:
      - utxo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9773/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  utxo-net:
    driver: bridge

volumes:
  node1-data:
  node2-data:
