[package]
name = "utxo-vmd"
version = "0.1.0"
edition = "2021"
description = "Universal P2P Node Daemon & Verifiable State Indexer for UTXO-VM"
license = "MIT"

[dependencies]
utxo-core-vm = { path = "../core-vm" }
tokio = { version = "1.40", features = ["full"] }
libp2p = { version = "0.54", features = ["tokio", "gossipsub", "kad", "identify", "ping", "noise", "yamux", "tcp", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
secp256k1 = { version = "0.29", features = ["rand", "serde", "global-context"] }
redb = "2.1"
futures = "0.3"

[[bin]]
name = "utxo-vmd"
path = "src/main.rs"

[lib]
name = "utxo_vmd"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
