[package]
name = "utxo-core-vm"
version = "0.1.0"
edition = "2021"
description = "Deterministic WebAssembly execution engine for Universal UTXO Smart Objects"
license = "MIT"

[lib]
name = "utxo_core_vm"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []

[dependencies]
wasmtime = "=18.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
anyhow = "1.0"

[dev-dependencies]
wat = "1.257"
hex = "0.4"
sha2 = "0.10"
serde_json = "1.0"

[[bin]]
name = "utxo-core-vm-cli"
path = "src/bin/main.rs"
