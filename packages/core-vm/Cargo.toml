[package]
name = "utxo-core-vm"
version = "0.1.0"
edition = "2021"
description = "Deterministic WebAssembly execution engine for Universal UTXO Smart Objects"
license = "MIT"

[dependencies]
wasmtime = "18.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "utxo-core-vm-cli"
path = "src/bin/main.rs"

[dev-dependencies]
wat = "1.257"
