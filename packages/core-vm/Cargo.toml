[package]
name = "utxo-core-vm"
version = "0.1.0"
edition = "2021"
description = "Deterministic WebAssembly execution engine for Universal UTXO Smart Objects"
license = "MIT"

[features]
default = []
experimental-zk = ["dep:ark-bn254", "dep:ark-groth16", "dep:ark-serialize"]

[dependencies]
wasmtime = "=18.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
anyhow = "1.0"
ark-bn254 = { version = "0.4", optional = true }
ark-groth16 = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }

[dev-dependencies]
wat = "1.257"
hex = "0.4"
sha2 = "0.10"

[[bin]]
name = "utxo-core-vm-cli"
path = "src/bin/main.rs"
